# CI gates (SEC-12). A milestone is not done until every job here is green.
# No gate may be disabled to make a build pass.
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # CI starts a real PostgreSQL so the database tests actually run, instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: analytics_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks must see the FULL history, not just the tip (SEC-2)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: bandit (security lint)
        run: bandit -q -r src app

      - name: pip-audit (known vulnerabilities)
        # Audits the full transitive set, not just the direct dependencies -- the first draft of
        # this project shipped a clean requirements.txt whose TRANSITIVE pillow had 40+ CVEs.
        run: pip-audit -r requirements.lock.txt

      - name: gitleaks (secret scan, FULL history)
        # Run the binary directly rather than gitleaks-action@v2.
        #
        # The action derives a commit range from the push event (before..after) and scans only
        # that range. Two problems with it here. First, SEC-2 requires scanning the **full
        # history** — a secret committed and then removed in a later push would never appear in
        # any single push range, which is exactly the case the requirement exists for. The
        # action was quietly doing a weaker check than the SRS claimed. Second, it breaks
        # outright after any history rewrite: the `before` commit no longer exists, git reports
        # "unknown revision", and the step fails with no leak found at all.
        #
        # `gitleaks detect` with no range scans every commit reachable from HEAD, which is what
        # was specified. checkout above already uses fetch-depth: 0 so the history is present.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Create schemas, roles and tables
        env:
          PGPASSWORD: ci_only_not_a_real_secret
        run: |
          for f in sql/ddl/*.sql; do
            psql -h localhost -U postgres -d analytics_demo -v ON_ERROR_STOP=1 \
              -v loader_user=loader_rw   -v loader_password=ci_loader_pw \
              -v ro_user=dashboard_ro    -v ro_password=ci_ro_pw \
              -f "$f"
          done

      - name: Create the analytics views
        # Worth a step of its own. Creating all 12 views proves every one is valid SQL and
        # that its dependencies resolve, which is checkable WITHOUT any data — a view over an
        # empty table still has to compile. The first CI run skipped this and 69 tests failed
        # with "relation analytics.v_ab_summary does not exist".
        env:
          PGPASSWORD: ci_only_not_a_real_secret
        run: |
          for f in sql/views/*.sql; do
            psql -h localhost -U postgres -d analytics_demo -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: pytest
        # The source data is not in git (425 MB, licence-restricted), so the warehouse here is
        # empty. Tests marked `db` detect that and SKIP — see tests/conftest.py. What still
        # runs: the pure statistics tests, the CSV-sanitiser tests, the contract checks, and
        # above all the DDL and view steps, which prove the whole schema compiles.
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_DB: analytics_demo
          LOADER_USER: loader_rw
          LOADER_PASSWORD: ci_loader_pw
          RO_USER: dashboard_ro
          RO_PASSWORD: ci_ro_pw
        run: pytest
